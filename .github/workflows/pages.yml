# Deployed by hand because Pages only hosts the static moved notice.
name: Publish moved notice to GitHub Pages
run-name: Publish GitHub Pages moved notice

# The browser edition has ended. Pages serves only a static notice so people
# with old bookmarks, including deep links such as /output.html, learn where it went.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Stage notice
        run: |
          mkdir site
          cp pages/index.html site/index.html
          cp pages/index.html site/404.html
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
