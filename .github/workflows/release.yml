name: Release Windows local version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Keep this version paired with NODE-LICENSE.txt.
          node-version: '24.19.0'
          architecture: x64
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw 'Use a version tag such as v1.0.0 or v1.0.0-beta.1.'
          }
      - run: npm run check
      - run: npm test
      - run: npm run build:local
      - name: Package Windows distribution
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if (Test-Path -LiteralPath 'dist-local/kick.js') { throw 'Kick must not be distributed.' }
          Compress-Archive -Path 'dist-local/*' -DestinationPath "pokome-reader-$env:RELEASE_TAG-windows-x64.zip"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $readerArchive = "pokome-reader-$env:RELEASE_TAG-windows-x64.zip"
          $readerHash = (Get-FileHash -LiteralPath $readerArchive -Algorithm SHA256).Hash.ToLower()
          Set-Content -LiteralPath "$readerArchive.sha256" -Value "$readerHash  $readerArchive" -Encoding ascii
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'This release already exists. Use a new version tag; published assets are immutable.'
          } else {
            $readerOptions = @('release', 'create', $env:RELEASE_TAG, $readerArchive, "$readerArchive.sha256", '--verify-tag', '--title', "ぽこめ Reader $env:RELEASE_TAG", '--generate-notes')
            if ($env:RELEASE_TAG.Contains('-')) { $readerOptions += '--prerelease' }
            gh @readerOptions
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed.' }
