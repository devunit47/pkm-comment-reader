name: Check and test
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - run: npm run check
      - run: npm test
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          architecture: x64
      - run: npm run build:local
      - name: Verify Windows distribution
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'dist-local/kick.js') { throw 'Kick must not be distributed.' }
          & ./dist-local/node.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Node.js failed to start.' }
      - name: Verify the Windows distribution
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'dist-local/kick.js') { throw 'Kick must not be distributed.' }
          & 'dist-local/node.exe' --version
          if ($LASTEXITCODE -ne 0) { throw 'The bundled node.exe does not start.' }
